server:
  port: 8080

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:logisticsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  # Flyway queda apagado en H2: el perfil default sigue generando el esquema
  # desde las entidades (ddl-auto: create-drop) para desarrollo rápido, y
  # el script de docs/62.dis.base.datos.postgresql.v01.md usa sintaxis
  # específica de Postgres (CREATE TYPE ... AS ENUM, etc.) que H2 no soporta
  # igual. Flyway solo se activa contra Postgres real (perfil prod, abajo).
  #
  # NOTA (22-sep-2026): además de "enabled: false", hay que EXCLUIR
  # explícitamente FlywayAutoConfiguration aquí (arriba, en autoconfigure.exclude).
  # Sin esto, Spring Boot detecta flyway-core en el classpath e intenta ordenar
  # su arranque respecto a JPA, generando:
  # "Circular depends-on relationship between 'flyway' and 'entityManagerFactory'"
  # — combinación específica de: H2 + ddl-auto=create-drop + defer-datasource-initialization=true
  # + flyway-core presente. El perfil prod (abajo) revierte este exclude a [].
  flyway:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logistics:
  config:
    critical-slack-hours: 4
    service-time-minutes: 60
    grid-width: 70
    grid-height: 50
    warehouse-max-capacity: 1000
    warehouse-alert-threshold: 90.0
    # semaphore-green-hours / semaphore-amber-hours: RETIRADOS de aquí.
    # El caso pide rangos de semáforo "parametrizables", así que pasaron a
    # ser un registro editable en BD (tabla configuracion_semaforo), en vez
    # de config estática que exige recompilar para cambiar un umbral.
    # Valores por defecto (12h verde / 4h ámbar) sembrados por
    # db/migration/V2__seed_configuracion_semaforo.sql. El código de
    # ConfiguracionSemaforo/Pedido.evaluarCriticidad debe leerlos de esa
    # tabla, no de application.yml.
    planning-timeout-seconds: 60   # antes: 30 — corregido para igualar el NFR real (ciclo de planificación ≤ 60 s)
    daily-restock-time: "23:59:59"
    vehicles:
      auto:
        speed: 40
        cost: 8.00
        capacity: 24
      moto:
        speed: 25
        cost: 6.00
        capacity: 8
      bicicleta:
        speed: 12
        cost: 3.00
        capacity: 4

---
spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    exclude: []
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration