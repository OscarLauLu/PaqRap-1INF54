services:
  # ----------------------------------------------------------------------------
  # Backend de OPERACIÓN (Operación día a día, siempre encendida) - puerto 8080
  # Tiene su propia base de datos en memoria (H2), separada de la simulación.
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paqrap-app
    ports:
      - "8082:8080"
    # En Linux (VM) "host.docker.internal" no existe por defecto: esta línea lo crea y lo
    # apunta al host, para que el contenedor llegue al MySQL instalado en la propia VM.
    # En Docker Desktop (Windows/Mac) ya existe y esta línea no estorba.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # "mysql" = MySQL de la VM del equipo (esquema por Hibernate) | "default" = H2 en memoria
      # | "rds" = Postgres (legado: requiere levantar el servicio "db" con --profile with-postgres)
      - SPRING_PROFILES_ACTIVE=${PAQRAP_PERFIL_OPERACION:-mysql}
      - PAQRAP_MODO=OPERACION
      # Conexión a la BD de operación (MySQL en la VM). Define APP_DB_* en .env (ver .env.example).
      # host.docker.internal = la máquina donde corre Docker (la VM en el despliegue).
      # El usuario de la app es "paqrap" (permisos solo sobre paqrap_operacion); root queda
      # para administrar la BD desde Workbench.
      - DB_HOST=${APP_DB_HOST:-host.docker.internal}
      - DB_PORT=${APP_DB_PORT:-3306}
      - DB_NAME=${APP_DB_NAME:-paqrap_operacion}
      - DB_USER=${APP_DB_USER:-paqrap}
      - DB_PASSWORD=${APP_DB_PASSWORD:-}
      - DB_SSL=${APP_DB_SSL:-false}
      - DB_SSLMODE=${APP_DB_SSLMODE:-disable}
      - PAQRAP_UPLOADS_DIR=/app/uploads
    volumes:
      # Monta la carpeta datos para leer archivos en tiempo real sin reconstruir
      - ./datos:/app/datos:ro
      # Archivos subidos desde el frontend: persisten entre reinicios
      - ./uploads:/app/uploads
    command: ["web"]

  # ----------------------------------------------------------------------------
  # Backend de SIMULACIÓN (Simulación 5D y colapso) - puerto 8081
  # Es el mismo código, pero otra instancia: su motor, su ACO y su base de datos
  # son independientes, así una simulación nunca afecta a la operación diaria.
  # ----------------------------------------------------------------------------
  app-simulacion:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: paqrap-app-simulacion
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - PAQRAP_MODO=SIMULACION
    volumes:
      - ./datos:/app/datos:ro
    command: ["web"]

  # ----------------------------------------------------------------------------
  # Cliente Web Frontend (React + Vite en puerto 5173)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paqrap-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda al hot reload en windows/mac
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobreescribir los módulos de Node instalados en Docker
    depends_on:
      - app
      - app-simulacion

  # ----------------------------------------------------------------------------
  # Servicio para ejecutar el Benchmark de Algoritmos Metaheurísticos en Java
  # ----------------------------------------------------------------------------
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paqrap-benchmark
    volumes:
      - ./datos:/app/datos:ro
      - ./:/app/out
    command: ["benchmark"]

  # ----------------------------------------------------------------------------
  # Servicio para ejecutar la Evaluación Automatizada de Desempeño (5D y Día a Día)
  # ----------------------------------------------------------------------------
  evaluacion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paqrap-evaluacion
    volumes:
      - ./datos:/app/datos:ro
    command: ["evaluacion"]

  # ----------------------------------------------------------------------------
  # Base de Datos PostgreSQL LEGADA (opcional): ya no es la BD de operación (ahora MySQL en la VM).
  # Solo arranca con: docker compose --profile with-postgres up db
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: paqrap-postgres
    ports:
      # Solo accesible desde esta máquina (DBeaver: localhost:5433). El puerto 5433 evita
      # chocar con un Postgres instalado en Windows. Para verlo desde fuera usa un túnel SSH.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: paqrap_operacion
      POSTGRES_USER: paqrap
      POSTGRES_PASSWORD: ${DB_LOCAL_PASSWORD:-paqrap_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paqrap -d paqrap_operacion"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - with-postgres

volumes:
  pgdata:
