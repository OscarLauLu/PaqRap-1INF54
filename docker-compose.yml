services:
  # ----------------------------------------------------------------------------
  # Servidor Web Spring Boot (API REST + Swagger UI en puerto 8080)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paqrap-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    volumes:
      # Monta la carpeta datos para leer archivos en tiempo real sin reconstruir
      - ./datos:/app/datos:ro
    command: ["web"]

  # ----------------------------------------------------------------------------
  # Cliente Web Frontend (React + Vite en puerto 5173)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paqrap-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda al hot reload en windows/mac
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobreescribir los módulos de Node instalados en Docker
    depends_on:
      - app

  # ----------------------------------------------------------------------------
  # Servicio para ejecutar el Benchmark de Algoritmos Metaheurísticos en Java
  # ----------------------------------------------------------------------------
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paqrap-benchmark
    volumes:
      - ./datos:/app/datos:ro
      - ./:/app/out
    command: ["benchmark"]

  # ----------------------------------------------------------------------------
  # Base de Datos PostgreSQL opcional (para perfil prod)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: paqrap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - with-db

volumes:
  pgdata:
